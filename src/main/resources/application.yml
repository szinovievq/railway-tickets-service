spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/railway}
    username: ${DB_USER:railway}
    password: ${DB_PASSWORD:railway}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234}
    expiration-minutes: 60
  booking:
    hold-minutes: 15