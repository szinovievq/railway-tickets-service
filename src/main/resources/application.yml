spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/railway}
    username: ${DB_USER:railway}
    password: ${DB_PASSWORD:railway}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234}
    expiration-minutes: 120
  booking:
    hold-minutes: 15